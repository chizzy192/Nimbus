<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="Nimbus — Parametric drought insurance on Stellar.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d0a"/>
      <stop offset="1" stop-color="#0c1e14"/>
    </linearGradient>

    <radialGradient id="glowGreen" cx="20%" cy="30%" r="50%">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="40%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#6ee7b7"/>
      <stop offset="70%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#10b981" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Layers -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#glowGreen)"/>
  <rect width="1500" height="500" fill="url(#glowCyan)"/>

  <!-- Floating cloud glyphs (decorative, very low opacity) -->
  <g fill="#6ee7b7" fill-opacity="0.07" font-family="Georgia, 'Times New Roman', serif">
    <text x="60"   y="120" font-size="120">☁︎</text>
    <text x="1180" y="160" font-size="90">☁︎</text>
    <text x="1340" y="420" font-size="150">☁︎</text>
    <text x="100"  y="440" font-size="70">☁︎</text>
  </g>

  <!-- Logo + wordmark -->
  <g transform="translate(80, 90)">
    <g transform="scale(2.2)">
      <rect width="32" height="32" rx="8" fill="#050d0a"/>
      <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#10b981" stroke-opacity="0.25"/>
      <path
        d="M22.4 17.6H10.2a3.6 3.6 0 0 1-.6-7.16 5.2 5.2 0 0 1 10-.06 3.3 3.3 0 0 1 2.8 7.22z"
        fill="url(#cloudGrad)"
      />
      <circle cx="12" cy="22.5" r="1.5" fill="#22d3ee"/>
      <circle cx="16" cy="24.8" r="1.5" fill="#22d3ee"/>
      <circle cx="20" cy="22.5" r="1.5" fill="#22d3ee"/>
    </g>

    <text
      x="100" y="55"
      font-family="'Syne', 'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-weight="800"
      font-size="68"
      letter-spacing="-2"
      fill="#ecfdf5"
    >Nimbus</text>
  </g>

  <!-- Eyebrow -->
  <text
    x="80" y="232"
    font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="20"
    letter-spacing="6"
    fill="#10b981"
  >PARAMETRIC CLIMATE INSURANCE  ·  STELLAR</text>

  <!-- Headline -->
  <text
    x="80" y="320"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="92"
    fill="#ecfdf5"
  >When rain fails,</text>
  <text
    x="80" y="410"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="92"
    fill="url(#shimmer)"
  >Nimbus pays.</text>

  <!-- Footer strip -->
  <line x1="80" y1="445" x2="1420" y2="445" stroke="#10b981" stroke-opacity="0.18"/>
  <g
    font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="16"
    letter-spacing="3"
    fill="#6ee7b7"
  >
    <text x="80" y="475">BOUNDLESS  ×  TRUSTLESS WORK  ·  MAY 2026</text>
    <text x="1420" y="475" text-anchor="end">STELLAR  ·  TRUSTLESS WORK  ·  OPEN-METEO</text>
  </g>
</svg>
